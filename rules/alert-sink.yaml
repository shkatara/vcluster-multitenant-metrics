# Tiny webhook sink so the demo can show which team received which alert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector:
    app: alert-sink
  ports:
    - port: 8080
      targetPort: 8080
